us:21px;text-align:center;border:2px solid transparent}.team.red{background:#fff0f1;border-color:#ffd7de}.team.blue{background:#edf4ff;border-color:#d6e5ff}.team strong{display:block;font-size:16px}.team .score{font-size:43px;font-weight:1000;letter-spacing:-2px}.result-row{margin:14px 0}.result-head{display:flex;justify-content:space-between;font-size:13px;font-weight:850;margin-bottom:6px}.result-track{height:17px;border-radius:99px;background:#f0ecfa;overflow:hidden}.result-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#8366eb,#ff84b2)}.center{text-align:center}.confetti{font-size:56px;text-align:center;animation:bob 2s infinite}.bottomnav{display:flex;justify-content:center;gap:8px;margin-top:26px}.foot{text-align:center;padding:30px 8px;color:#9a91ac;font-size:12px}.error{color:#b53c59;background:#ffedf0;border-radius:13px;padding:12px 14px;line-height:1.5;font-size:13px}.toast{position:fixed;bottom:23px;left:50%;transform:translateX(-50%) translateY(30px);background:#2b2643;color:#fff;border-radius:15px;padding:13px 17px;z-index:100;box-shadow:0 8px 20px #0003;max-width:min(90vw,480px);text-align:center;font-size:13px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.spinner{display:inline-block;width:18px;height:18px;border:3px solid #d3beff;border-top-color:#7545d9;border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle}@keyframes spin{to{transform:rotate(360deg)}}.codeblock{background:#28213c;color:#e7ddff;border-radius:14px;padding:15px;font-size:11px;line-height:1.55;white-space:pre-wrap;word-break:break-all;max-height:290px;overflow:auto}.summary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.summary{border-radius:15px;background:#f5efff;padding:15px;text-align:center}.summary strong{display:block;font-size:23px;color:#7652d5}.summary small{color:var(--sub)}.tabbar{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}.modeflag{padding:7 <body>
<div class="shell"><header class="top"><div class="brand" id="brand" role="button" tabindex="0" title="PartyMix 首頁"><span class="brand-symbol">✦</span><span>Party<span style="color:#ed4e99">Mix</span></span></div><div class="top-right"><span class="status" id="connection"><span class="dot"></span>尚未連線</span><button class="mini-btn" data-action="help">玩法說明</button><button class="mini-btn" data-action="setup">⚙ 設定</button></div></header><main id="app" aria-live="polite"></main><footer class="foot">Made for laughter ✦ PartyMix · 單一 HTML / 支援 Firebase 多人連線</footer></div>
<div class="toast" id="toast" role="status"></div><div id="confetti" class="confetti-layer" aria-hidden="true"></div>
<!-- 將 Firebase Console > 專案設定 > Web App 的 firebaseConfig JSON 放到下方。單檔發布時，所有裝置會使用相同設定。 -->
<script type="application/json" id="firebase-config">{}</script>
<!-- 以下規則供貼到 Firebase Console / Realtime Database / Rules。請在正式使用前檢查並發布。 -->
<template id="firebase-rules">{
  "rules": {
    "roomCodes": {
      "$code": {
        ".read": "auth != null",
        ".write": "auth != null && !data.exists() && newData.child('hostUid').val() === auth.uid",
        ".validate": "newData.hasChildren(['hostUid', 'createdAt']) && newData.child('hostUid').isString() && newData.child('createdAt').isNumber()"
      }
    },
    "rooms": {
      "$room": {
        ".write": "auth != null && !data.exists() && newData.child('meta').child('hostUid').val() === auth.uid && newData.child('game').child('stage').val() === 'lobby' && newData.child('players').child(auth.uid).exists()",
        "meta": {
          ".read": "auth != null",
          ".validate": "newData.hasChildren(['hostUid', 'mode', 'createdAt']) && newData.child('hostUid').isString() && (newData.child('mode').val() === 'party' || newData.child('mode').val() === 'pk')"
        },
        "players": {
          ".read": "auth != null && (data.child(auth.uid).exists() || root.child('rooms').child($room).child('meta').child('hostUid').val() === auth.uid)",
          "$uid": {
            ".read": "auth != null && auth.uid === $uid",
            ".write": "auth != null && auth.uid === $uid && (data.exists() || (root.child('rooms').child($room).child('game').child('stage').val() === 'lobby' && root.child('rooms').child($room).child('players').numChildren() < 20))",
            ".validate": "newData.hasChildren(['uid','name','ready','joinedAt','online','playing']) && newData.child('uid').val() === auth.uid && newData.child('name').isString() && newData.child('name').val().length >= 1 && newData.child('name').val().length <= 36 && newData.child('ready').isBoolean() && newData.child('online').isBoolean() && newData.child('playing').isBoolean() && newData.child('joinedAt').isNumber() && (!data.exists() || (newData.child('joinedAt').val() === data.child('joinedAt').val() && newData.child('playing').val() === data.child('playing').val() && (root.child('rooms').child($room).child('game').child('stage').val() === 'lobby' || newData.child('name').val() === data.child('name').val())))"
          }
        },
        "game": {
          ".read": "auth != null && root.child('rooms').child($room).child('players').child(auth.uid).exists()",
          ".write": "auth != null && root.child('rooms').child($room).child('meta').child('hostUid').val() === auth.uid"
        },
        "submissions": {
          "$round": {
            ".read": "auth != null && root.child('rooms').child($room).child('meta').child('hostUid').val() === auth.uid",
            "$uid": {
              ".read": "auth != null && auth.uid === $uid",
              ".write": "auth != null && auth.uid === $uid && !data.exists() && root.child('rooms').child($room).child('players').child(auth.uid).child('playing').val() === true && root.child('rooms').child($room).child('game').child('stage').val() === 'playing' && root.child('rooms').child($room).child('game').child('roundId').val() === $round && now <= root.child('rooms').child($room).child('game').child('deadline').val()",
              ".validate": "newData.hasChildren(['answer','submittedAt']) && newData.child('answer').isString() && newData.child('answer').val().matches(/^[0-4]$/) && newData.child('submittedAt').isNumber() && newData.child('submittedAt').val() <= now + 5000 && newData.child('submittedAt').val() >= now - 10000"
            }
          }
        }
      }
    }
  }
}</template>

const state0={view:'home',mode:'demo',code:'',uid:'',room:null,submissions:{},firebase:null,modules:null,unsubs:[],offset:0,connected:false,busy:false,selection:{mode:'party',duration:20,difficulty:'mix',playing:true},joinCode:'',nick:'',setupText:'',ticker:null,autoClosing:false};
const S=state0;
const LOCAL_CONFIG_KEY='partymix-firebase-config-v1';
const LAST_ROOM_KEY='partymix-last-room-v1';
const CONFIG=(()=>{try{const embed=JSON.parse($('#firebase-config').textContent.trim());return embed.apiKey&&embed.databaseURL?embed:JSON.parse(localStorage.getItem(LOCAL_CONFIG_KEY)||'{}')}catch{return {}}})();
const configReady=()=>Boolean(CONFIG.apiKey&&CONFIG.authDomain&&CONFIG.databaseURL&&CONFIG.projectId&&CONFIG.appId);
let demoUid='demo_host';
let toastTimer;
function toast(message){let e=$('#toast');e.textContent=message;e.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.classList.remove('show'),3600)}
function setBusy(v){S.busy=!!v;document.querySelectorAll('button[data-action]').forEach(b=>{if(v&&!['setup'].includes(b.dataset.action))b.disabled=true})}
function getStage(){return S.room?.game?.stage||''}
function isHost(){return !!S.room&&S.room.meta.hostUid===S.uid}
function myPlayer(){return S.room?.players?.[S.uid]||null}
function allPlayers(){return Object.values(S.room?.players||{}).filter(p=>p&&p.playing)}
function participantIds(){return (S.room?.game?.roster?.length?S.room.game.roster:allPlayers().map(p=>p.uid)).filter(id=>S.room?.players?.[id])}
function displayName(uid){return S.room?.players?.[uid]?.name||'玩家'}
function roundQuestion(){let id=S.room?.game?.questionId;return QUESTIONS.find(x=>x.id===id)||null}
function safeButtons(){return S.busy?'disabled':''}
function copyText(text){if(navigator.clipboard?.writeText&&location.protocol!=='file:')return navigator.clipboard.writeText(text).then(()=>toast('已複製到剪貼簿！')).catch(()=>fallbackCopy(text));return fallbackCopy(text)}
function fallbackCopy(text){let el=document.createElement('textarea');el.value=text;el.style.position='fixed';el.style.opacity='0';document.body.appendChild(el);el.select();try{document.execCommand('copy');toast('已複製！')}catch{toast('無法自動複製，請手動選取')}el.remove()}
function encodedInvite(){const u=new URL(location.href);u.searchParams.set('room',S.code);return u.href}
function localSave(){try{localStorage.setItem(LAST_ROOM_KEY,JSON.stringify({code:S.code,mode:S.mode}))}catch{}}
function getSaved(){try{return JSON.parse(localStorage.getItem(LAST_ROOM_KEY)||'null')}catch{return null}}
function statusUpdate(){let el=$('#connection');let online=S.mode==='online'&&S.room, demo=S.mode==='demo'&&S.room;let live=online&&S.connected;el.innerHTML=`<span class="dot ${live?'good':demo?'good':'bad'}"></span>${online?(live?'Firebase 即時連線':'Firebase 已斷線'):demo?'本機體驗模式':configReady()?'Firebase 待連線':'未設定 Firebase'}`}
const btn=(text,action,cls='btn-primary',attrs='')=>`<button class="btn ${cls}" data-action="${action}" ${attrs}>${text}</button>`;
const block=(text,action,cls='btn-primary',attrs='')=>btn(text,action,cls+' btn-block',attrs);
function page(content){app.innerHTML=`<div class="page">${content}</div>`;statusUpdate()}
function render(){if(S.room){renderRoom();return} if(S.view==='create')return renderCreate(); if(S.view==='join')return renderJoin(); if(S.view==='setup')return renderSetup();if(S.view==='help')return renderHelp();renderHome()}
function renderHome(){let resume=getSaved();page(`<section class="hero"><div><div class="eyebrow">✨ 隨時隨地 · 揪團開玩！</div><h1>揪團就來<br><span>PartyMix!</span></h1><p class="lead">一個房號，歡樂開玩！<br>搞笑挑戰、即時投票、默契 PK，讓每一次聚會都變成派對。</p><div class="btns">${btn('🚀 建立房間','create','btn-primary btn-lg')}${btn('🔑 加入房間','join','btn-pink btn-lg')}</div><div class="btns" style="margin-top:10px">${btn('🎮 本機歡樂試玩','demo','btn-outline')}${btn('🏆 本機分組 PK 試玩','demoPK','btn-outline')}${resume&&resume.mode==='online'?btn('↩ 返回上次的房間','resume','btn-light'):''}</div><p class="hint" style="margin-top:12px">${configReady()?'✓ 已設定 Firebase。多人遊戲仍須網路可用，且請先發布正確安全規則。':'💡 本機體驗不需要網路或 CDN；多人模式需設定 Firebase，並且要能連線至 Firebase 伺服器。'}</p></div><div class="hero-art"><span class="float f1">🎲</span><span class="float f2">🎉</span><span class="float f3">⚡</span><span class="float f4">🏆</span><div class="hero-center"><div style="font-size:47px">🥳</div><div class="word">PLAY<br>TOGETHER!</div><div class="tiny">投票 · 挑戰 · 分組 PK</div></div></div></section><h2 class="section-h">今天想怎麼玩？</h2><div class="features"><div class="feature"><span class="feature-emoji">🎭</span><div><h3>搞笑挑戰</h3><p>抽到誰就是誰！模仿、比手畫腳、各種有趣任務。</p></div></div><div class="feature"><span class="feature-emoji">📱</span><div><h3>手機即時互動</h3><p>朋友一起用手機答題、投票，結果同步揭曉。</p></div></div><div class="feature"><span class="feature-emoji">🏆</span><div><h3>團隊 PK</h3><p>自動分組、默契考驗、累積積分決定冠軍！</p></div></div></div>`)}
function renderCreate(){page(`<div class="layout"><div class="subhead"><span class="tag">PARTY STARTER</span><h1>🎊 建立你的派對</h1><p class="muted">準備好了嗎？設定一下，馬上把大家揪進來！</p></div><form id="createForm" class="card"><div class="field"><label for="hostNick">你的暱稱</label><input class="input" name="nick" id="hostNick" placeholder="例如：派對大王" maxlength="12" required value="${esc(S.nick)}"></div><p class="label">選擇遊戲模式</p><div class="grid2" id="modeChoices"><div class="choice ${S.selection.mode==='party'?'active':''}" data-choice="mode:party"><div class="big">🎉</div><strong>歡樂派對</strong><small>搞笑挑戰、投票、問答，輕鬆嗨翻全場</small></div><div class="choice ${S.selection.mode==='pk'?'active':''}" data-choice="mode:pk"><div class="big">🏆</div><strong>分組 PK</strong><small>兩隊對抗、默契考驗、積分爭奪冠軍</small></div></div><div class="ruleline"></div><div class="grid2"><div class="field"><label for="duration">活動時間</label><select id="duration" name="duration"><option value="10" ${S.selection.duration==10?'selected':''}>10 分鐘 · 6 回合</option><option value="20" ${S.selection.duration==20?'selected':''}>20 分鐘 · 12 回合</option><option value="30" ${S.selection.duration==30?'selected':''}>30 分鐘 · 18 回合</option><option value="5" ${S.selection.duration==5?'selected':''}>5 分鐘 · 3 回合</option></select></div><div class="field"><label for="difficulty">題目難度</label><select id="difficulty" name="difficulty"><option value="mix">全部難度</option><option value="easy" ${S.selection.difficulty==='easy'?'selected':''}>輕鬆歡樂</option><option value="hard" ${S.selection.difficulty==='hard'?'selected':''}>多一點挑戰</option></select></div></div><label class="chip" style="display:inline-flex;align-items:center;gap:9px"><input name="playing" type="checkbox" ${S.selection.playing?'checked':''}>主持人也一起參加遊戲</label><div class="ruleline"></div>${!configReady()?`<div class="guide warn" style="margin-bottom:17px"><strong>⚠ 尚未設定 Firebase</strong><p>真正多人房間需要先設定 Firebase；如果想先操作整套遊戲，可返回首頁選擇「立即試玩」。</p></div>`:''}<div class="btns">${btn('← 返回','home','btn-light')}<button class="btn btn-primary" type="submit" ${!configReady()?'disabled':''}>建立即時房間 ✨</button></div></form></div>`)}
function renderJoin(){let pre=S.joinCode||new URLSearchParams(location.search).get('room')||'';page(`<div class="layout"><div class="subhead"><span class="tag pink">JOIN THE PARTY</span><h1>🔑 加入派對</h1><p class="muted">輸入朋友給你的房號，派對馬上開始！</p></div><form id="joinForm" class="card"><div class="field"><label for="roomCode">房間代碼</label><input class="input center" style="font-weight:1000;font-size:27px;letter-spacing:5px;text-transform:uppercase" id="roomCode" name="code" maxlength="6" placeholder="A7K92B" value="${esc(pre)}" required></div><div class="field"><label for="joinNick">你的暱稱</label><input class="input" id="joinNick" name="nick" maxlength="12" placeholder="例如：笑點超低的我" value="${esc(S.nick)}" required></div>${!configReady()?`<div class="guide warn" style="margin-bottom:17px">⚠ 尚未設定 Firebase。點「設定」貼入專案設定後才能加入真正多人房間。</div>`:''}<div class="btns">${btn('← 返回','home','btn-light')}<button type="submit" class="btn btn-primary" ${!configReady()?'disabled':''}>加入遊戲 🚀</button></div></form></div>`)}
function renderHelp(){page(`<div class="layout"><div class="subhead"><span class="tag">HOW TO PLAY</span><h1>🪄 PartyMix 遊戲指南</h1></div><div class="card"><div class="step"><b>1</b><div><strong>建立 / 加入房間</strong><p class="muted">主持人建立房間，朋友用房號或分享連結加入。</p></div></div><div class="step"><b>2</b><div><strong>選擇歡樂派對或分組 PK</strong><p class="muted">歡樂派對偏搞笑互動；分組 PK 會隨機組成紅隊與藍隊。</p></div></div><div class="step"><b>3</b><div><strong>答題、投票、完成挑戰</strong><p class="muted">每位玩家可在自己的手機提交答案；實體挑戰交由主持人判定。</p></div></div><div class="step"><b>4</b><div><strong>公布結果、下一題</strong><p class="muted">全部同步公布，PK 模式累積分數爭奪冠軍。</p></div></div><div class="guide good"><strong>🎮 本機體驗模式</strong><p>不需 Firebase 就能操作所有遊戲流程；其中其他玩家的作答可由主持人按「模擬其他玩家作答」。這是明確標示的單機示範，不會假裝是真人遠端連線。</p></div><div style="margin-top:19px">${btn('← 回首頁','home','btn-primary')}</div></div></div>`)}
function renderSetup(){let example=`{\n  "apiKey": "...",\n  "authDomain": "YOUR_PROJECT.firebaseapp.com",\n  "databaseURL": "https://YOUR_DB-default-rtdb.firebaseio.com",\n  "projectId": "YOUR_PROJECT",\n  "appId": "1:...:web:..."\n}`;page(`<div class="layout"><div class="subhead"><span class="tag">FIREBASE CONNECT</span><h1>⚙ 多人連線設定</h1><p class="muted">第一次設定後，就能讓每個人用自己的手機加入同一房間。</p></div><div class="card"><div class="guide ${configReady()?'good':'warn'}"><strong>${configReady()?'✅ Firebase 前端設定已存在':'⚠ 尚未設定 Firebase'}</strong><p>本機試玩不需要網路；多人連線則必須建立 Firebase 專案並啟用匿名驗證及 Realtime Database。</p></div><h3>設定步驟</h3><div class="step"><b>1</b><div>前往 <a href="https://console.firebase.google.com/" target="_blank" rel="noopener">Firebase Console</a> 建立專案，加入「網頁應用程式」。</div></div><div class="step"><b>2</b><div>Authentication → Sign-in method → 啟用「匿名」。</div></div><div class="step"><b>3</b><div>Build → Realtime Database → 建立資料庫。將下方安全規則貼入 Rules 並發布。<strong>不要使用公開讀寫測試規則。</strong></div></div><div class="step"><b>4</b><div>專案設定 → Web App → 複製 <code>firebaseConfig</code> 物件，確認包含 <code>databaseURL</code>。</div></div><div class="step"><b>5</b><div>先在下方貼入設定，測試瀏覽器連線。要給所有玩家使用，須把相同設定填進 HTML 原始碼中的 <code>firebase-config</code> 區塊，再將該檔案發布到 GitHub Pages。</div></div><div class="field"><label for="configText">貼入 Firebase JSON 設定（不用輸入管理員私鑰）</label><textarea id="configText" spellcheck="false" placeholder="${esc(example)}">${esc(JSON.stringify(CONFIG,null,2)==='{}'?'':JSON.stringify(CONFIG,null,2))}</textarea></div>${btn('💾 儲存這台瀏覽器的設定','saveConfig','btn-primary')}${btn('📋 複製安全規則','copyRules','btn-outline')}<h3>Firebase Realtime Database 安全規則</h3><p class="hint">請複製並貼入 Firebase Console 的 Rules 頁面。這組規則是教學用途的基礎保護，正式公開活動前仍應用 Firebase Emulator 測試權限、重連與邊界情況。</p><pre class="codeblock" id="rulesDisplay">${esc($('#firebase-rules').textContent.trim())}</pre><h3>GitHub Pages</h3><p class="muted">把填入 Firebase 設定的單一 <code>index.html</code> 上傳至 GitHub 儲存庫根目錄，在 Settings → Pages → Deploy from a branch 選擇 main / (root)，公開後分享網址即可。</p><div class="guide"><strong>重要限制</strong><p>本頁輸入並儲存設定只影響這台瀏覽器。若使用公開網址供其他玩家加入，請將設定寫進 HTML 的 <code>&lt;script id="firebase-config"&gt;</code> 區塊並重新上傳 GitHub。資料庫、Auth 和安全規則仍需在 Firebase 控制台設定。</p></div><div style="margin-top:20px">${btn('← 回首頁','home','btn-light')}</div></div></div>`)}
function modeLabel(){return S.room.meta.mode==='pk'?'🏆 分組 PK':'🎉 歡樂派對'}
function pList(players){return `<div class="players">${players.map(p=>`<div class="player"><div class="avatar">${p.uid===S.room.meta.hostUid?'👑':chooseStableEmoji(p.uid)}</div><div class="player-info"><div class="player-name">${esc(p.name)} ${p.uid===S.uid?'<span style="color:#8a64d7">(你)</span>':''}</div><div class="player-sub">${p.uid===S.room.meta.hostUid?'主持人 · ':''}${p.online?'🟢 在線':'⚪ 離線'}${p.playing?'':' · 不參賽'}</div></div><span class="${p.ready?'ready':'notready'}">${p.ready?'✓ 已準備':'等待中'}</span></div>`).join('')}</div>`}
function chooseStableEmoji(uid){return ['😎','🤩','😺','🦄','🐸','🍓','🐣','👾'][[...uid].reduce((a,c)=>a+c.charCodeAt(0),0)%8]}

function fmtTime(ms){ms=Math.max(0,Math.ceil((Number(ms)||0)/1000));return `${String(Math.floor(ms/60)).padStart(2,'0')}:${String(ms%60).padStart(2,'0')}`}

function newGame(mode,duration){return {stage:'lobby',mode,duration,totalRounds:Math.max(3,Math.round(duration*.6)),round:0,roundId:'',questionId:'',activeUid:'',deadline:0,remaining:0,roster:[],teams:{},scores:{red:0,blue:0},counts:{},used:[],history:[],result:null,createdAt:Date.now()}}
function selectQuestion(g){let choices=QUESTIONS.filter(q=>(g.mode==='party'?['challenge','vote','quiz']:['quiz','team','sync']).includes(q.kind)&&q.min<=g.roster.length);
let pref=S.room?.meta.difficulty||'mix';if(pref==='easy')choices=choices.filter(q=>q.level===1);else if(pref==='hard'){let hard=choices.filter(q=>q.level===2);if(hard.length)choices=hard}
let unused=choices.filter(q=>!g.used?.includes(q.id));if(!unused.length)unused=choices;if(!unused.length)return null;
let last=(g.history||[]).slice(-1)[0]?.kind;let diff=unused.filter(q=>q.kind!==last);if(diff.length)unused=diff;return choose(unused)}
function prepareValue(g){const q=selectQuestion(g);if(!q)throw Error('找不到適合的題目，請調整人數或難度');let counts={...(g.counts||{})},activeUid='';if(q.kind==='challenge'){let min=Math.min(...g.roster.map(uid=>counts[uid]||0));activeUid=choose(g.roster.filter(uid=>(counts[uid]||0)===min));counts[activeUid]=(counts[activeUid]||0)+1}
return {...g,stage:'ready',round:g.round+1,roundId:ident(),questionId:q.id,activeUid,deadline:0,remaining:0,result:null,counts,used:[...(g.used||[]),q.id]}}
function startGameValue(g){let roster=allPlayers().map(p=>p.uid);if(roster.length<(g.mode==='pk'?4:2))throw Error('參賽人數不足');if(!allPlayers().every(p=>p.ready))throw Error('請所有參賽玩家完成準備');return {...g,roster,round:0,history:[],used:[],counts:{},scores:{red:0,blue:0},teams:g.mode==='pk'?Object.fromEntries(shuffle(roster).map((id,i)=>[id,i%2?'blue':'red'])):{},stage:g.mode==='pk'?'grouping':'lobby'}}
function settleResult(g,answers,judge){let q=QUESTIONS.find(x=>x.id===g.questionId);let result={kind:q.kind,questionId:q.id,submitted:Object.keys(answers||{}).length,redPoints:0,bluePoints:0},scores={...g.scores},roster=g.roster;
if(q.kind==='vote'){result.counts=q.options.map((_,i)=>Object.values(answers).filter(v=>v.answer===String(i)).length)}
if(q.kind==='quiz'){let correct=roster.filter(uid=>answers[uid]?.answer===String(q.answer));result.correctTotal=correct.length;if(g.mode==='pk'){for(const team of ['red','blue']){let players=roster.filter(uid=>g.teams?.[uid]===team);let hit=players.filter(uid=>correct.includes(uid)).length;let pt=hit>=Math.ceil(players.length/2)?10:0;result[team+'Points']=pt;scores[team]=(scores[team]||0)+pt}}}
if(q.kind==='sync'){for(const team of ['red','blue']){let players=roster.filter(uid=>g.teams?.[uid]===team);let vals=players.map(uid=>answers[uid]?.answer);let match=players.length>0&&vals.every(v=>v!==undefined&&v===vals[0]);result[team+'Match']=match;result[team+'Points']=match?10:0;scores[team]=(scores[team]||0)+(match?10:0)}}
if(q.kind==='challenge'){result.challenge=judge?.challenge||'skip'}
if(q.kind==='team'){let pt=q.level===2?20:10;result.redWin=!!judge?.red;result.blueWin=!!judge?.blue;result.redPoints=result.redWin?pt:0;result.bluePoints=result.blueWin?pt:0;scores.red=(scores.red||0)+result.redPoints;scores.blue=(scores.blue||0)+result.bluePoints}
return {result,scores}}
function demoCreate(){S.mode='demo';S.uid=demoUid;S.code='DEMO01';let nick=S.nick||'派對主持人';let players={[demoUid]:{uid:demoUid,name:nick,ready:true,online:true,joinedAt:Date.now(),playing:true}};['小明','小美','阿傑'].forEach((name,i)=>{let id='sample_'+i;players[id]={uid:id,name,ready:true,online:true,playing:true,joinedAt:Date.now()}});S.room={meta:{hostUid:demoUid,mode:S.selection.mode,duration:S.selection.duration,difficulty:S.selection.difficulty,createdAt:Date.now()},players,game:newGame(S.selection.mode,S.selection.duration)};S.submissions={};S.room.game.totalRounds=Math.max(3,Math.round(S.selection.duration*.6));localSave();render();toast('已進入本機體驗模式！')}
async function ensureFirebase(){if(S.firebase){S.uid=S.modules?.auth?.currentUser?.uid||S.uid;return S.firebase;}if(!configReady())throw Error('請先完成 Firebase 設定');try{const v='11.10.0',base=`https://www.gstatic.com/firebasejs/${v}/`;let [A,B,D]=await Promise.all([import(base+'firebase-app.js'),import(base+'firebase-auth.js'),import(base+'firebase-database.js')]);let appInst=A.initializeApp(CONFIG),auth=B.getAuth(appInst),db=D.getDatabase(appInst);await B.signInAnonymously(auth);S.modules={A,B,D,auth,db};S.firebase=true;S.uid=auth.currentUser.uid;D.onValue(D.ref(db,'.info/serverTimeOffset'),snap=>{S.offset=snap.val()||0});D.onValue(D.ref(db,'.info/connected'),snap=>{S.connected=!!snap.val();statusUpdate();});return true}catch(err){S.firebase=false;throw Error('Firebase 初始化失敗：'+(err.message||err))}}

let currentRoundListen='';
function listenRound(){if(S.mode!=='online'||!S.room?.game||!S.modules||!S.room.meta)return;const g=S.room.game,code=S.code,{D,db}=S.modules;const key=g.roundId?`${g.roundId}:${isHost()?'host':'player'}`:'';if(key===currentRoundListen)return;S.unsubs.filter(x=>x._roundListener).forEach(x=>{try{x()}catch{}});S.unsubs=S.unsubs.filter(x=>!x._roundListener);currentRoundListen=key;S.submissions={};if(!g.roundId)return;let path=isHost()?`rooms/${code}/submissions/${g.roundId}`:`rooms/${code}/submissions/${g.roundId}/${S.uid}`;let u=D.onValue(D.ref(db,path),snap=>{if(S.code!==code||S.room?.game?.roundId!==g.roundId)return;S.submissions=isHost()?(snap.val()||{}):(snap.exists()?{[S.uid]:snap.val()}:{}) ;if(['playing','paused','judging','revealing'].includes(S.room?.game?.stage))render();},e=>{console.warn('作答監聽失敗',e)});u._roundListener=true;S.unsubs.push(u)}
async function watchRoom(code){clearListeners();currentRoundListen='';S.code=code;S.mode='online';S.room={meta:null,players:{},game:null};const {D,db}=S.modules;let base=`rooms/${code}/`;for(let key of ['meta','players','game']){let u=D.onValue(D.ref(db,base+key),snap=>{if(!S.room||S.code!==code)return;let val=snap.val();if(key==='game'){let previous=S.room.game?.roundId;S.room.game=val;if(previous!==val?.roundId){currentRoundListen='';S.submissions={}}listenRound()}else S.room[key]=val||{};if(S.room.meta&&S.room.game&&S.room.players){listenRound();render()}},err=>toast('同步失敗：'+(err.message||err)));S.unsubs.push(u)}localSave();render()}
async function createOnline(){if(S.busy)return;setBusy(true);try{await ensureFirebase();let {D,db}=S.modules,uid=S.uid,code='',nick=S.nick;for(let i=0;i<8;i++){let candidate=genCode();let game=newGame(S.selection.mode,S.selection.duration);let room={meta:{hostUid:uid,mode:S.selection.mode,duration:S.selection.duration,difficulty:S.selection.difficulty,createdAt:Date.now()},players:{[uid]:{uid,name:nick,ready:true,joinedAt:Date.now(),online:true,playing:S.selection.playing}},game};let claim=D.ref(db,'roomCodes/'+candidate);let r=await D.runTransaction(claim,old=>old===null?{hostUid:uid,createdAt:Date.now()}:undefined,{applyLocally:false});if(r.committed){await D.set(D.ref(db,'rooms/'+candidate),room);code=candidate;break}}if(!code)throw Error('無法分配房號，請再試一次');await watchRoom(code);await registerPresence();toast('已建立房間 '+code+'！')}catch(err){toast('建立失敗：'+err.message)}finally{setBusy(false);render()}}
async function joinOnline(code,nick){if(S.busy)return;setBusy(true);try{await ensureFirebase();let {D,db}=S.modules;let meta=(await D.get(D.ref(db,`rooms/${code}/meta`))).val();if(!meta)throw Error('房號不存在');const own=D.ref(db,`rooms/${code}/players/${S.uid}`);let prev=(await D.get(own)).val();if(!prev){let player={uid:S.uid,name:nick,ready:false,online:true,playing:true,joinedAt:Date.now()};await D.set(own,player);let roster=(await D.get(D.ref(db,`rooms/${code}/players`))).val()||{};let collision=Object.values(roster).some(p=>p&&p.uid!==S.uid&&String(p.name||'').normalize('NFKC').trim().toLocaleLowerCase()===nick.normalize('NFKC').trim().toLocaleLowerCase());if(collision){await D.remove(own);throw Error('這個暱稱已被使用，請換一個名字再加入')}}await watchRoom(code);await registerPresence();toast('成功加入房間！')}catch(err){toast('加入失敗：'+(err.message||err))}finally{setBusy(false);render()}}
async function registerPresence(){if(S.mode!=='online')return;const {D,db}=S.modules,path=D.ref(db,`rooms/${S.code}/players/${S.uid}/online`);try{await D.onDisconnect(path).set(false);await D.set(path,true)}catch(e){console.warn('presence:',e)}}
async function gameTransact(change){if(S.mode==='demo'){let v=change(structuredClone(S.room.game));if(!v)return false;let prior=S.room.game.roundId;S.room.game=v;if(prior!==v.roundId)S.submissions={};render();return true}if(!isHost())throw Error('只有主持人可以操作');const {D,db}=S.modules;let ref=D.ref(db,`rooms/${S.code}/game`);let result=await D.runTransaction(ref,old=>old?change(old):undefined,{applyLocally:false});return !!result.committed}
async function writeGame(change){try{let ok=await gameTransact(change);if(!ok)toast('操作無效，遊戲階段可能已更新');return ok}catch(e){toast('操作失敗：'+e.message);return false}}
async function hostBegin(){try{if(!isHost())return;let active=allPlayers(),g=S.room.game;let min=g.mode==='pk'?4:2;if(active.length<min)throw Error('參賽人數不足');if(!active.every(p=>p.ready))throw Error('請所有玩家準備完成');let roster=active.map(p=>p.uid),team=Object.fromEntries(shuffle(roster).map((id,i)=>[id,i%2?'blue':'red']));let base={...g,roster,teams:g.mode==='pk'?team:{},scores:{red:0,blue:0},used:[],counts:{},history:[],round:0};let partyReady=g.mode==='party'?prepareValue(base):null;await writeGame(old=>old.stage==='lobby'?(old.mode==='pk'?{...old,...base,stage:'grouping'}:{...old,...partyReady,stage:'ready'}):undefined)}catch(e){toast(e.message)}}
async function nextQuestion(){if(!isHost())return;let g=S.room.game;let candidate;try{let temp=structuredClone(g);if(!temp.roster?.length)throw Error('沒有參賽玩家');candidate=prepareValue(temp)}catch(e){return toast(e.message)}await writeGame(old=>{if(!['lobby','grouping','revealing'].includes(old.stage))return; if(old.round>=old.totalRounds)return {...old,stage:'finished'};return {...candidate,round:old.round+1,roundId:ident(),stage:'ready'}})}
async function regroup(){let g=S.room.game;if(g.stage!=='grouping')return;let ids=shuffle(g.roster);await writeGame(old=>old.stage==='grouping'?{...old,teams:Object.fromEntries(ids.map((id,i)=>[id,i%2?'blue':'red']))}:undefined)}
async function reroll(){let g=S.room.game;if(g.stage!=='ready')return;let q=selectQuestion(g);if(!q){toast('沒有其他合適的題目');return}let oldId=g.questionId;let alternative=QUESTIONS.filter(x=>x.kind===q.kind&&x.id!==oldId&&!g.used.includes(x.id)&&x.min<=g.roster.length);let newQ=alternative.length?choose(alternative):q;await writeGame(old=>old.stage==='ready'?{...old,questionId:newQ.id,roundId:ident(),activeUid:newQ.kind==='challenge'?choose(old.roster):'',used:[...old.used,newQ.id]}:undefined)}
async function startRound(){await writeGame(g=>{if(g.stage!=='ready')return;const q=QUESTIONS.find(item=>item.id===g.questionId);if(!q)return;const duration=roundTime(q)*1000;return {...g,stage:'playing',deadline:now()+duration,remaining:duration}})}
async function pauseRound(){await writeGame(g=>g.stage==='playing'?{...g,stage:'paused',remaining:Math.max(0,g.deadline-now()),deadline:0}:undefined)}
async function resumeRound(){await writeGame(g=>g.stage==='paused'?{...g,stage:'playing',deadline:now()+Math.max(0,g.remaining)}:undefined)}
async function endRound(){let did=await writeGame(g=>['playing','paused'].includes(g.stage)?{...g,stage:'judging',deadline:0,remaining:0}:undefined);if(!did)return;let q=roundQuestion();if(q&&['quiz','vote','sync'].includes(q.kind)&&S.mode==='online')await settle()}
async function submitAnswer(index){let g=S.room?.game,q=roundQuestion();if(!q||g.stage!=='playing'||!myPlayer()?.playing)return;if(now()>g.deadline){toast('已超過作答時間');return}if(S.submissions[S.uid])return;const value=String(index);if(!q.options?.[index])return;try{if(S.mode==='demo'){S.submissions[S.uid]={answer:value,submittedAt:now()};render();toast('已送出答案！')}else{let {D,db}=S.modules;let p=D.ref(db,`rooms/${S.code}/submissions/${g.roundId}/${S.uid}`);await D.set(p,{answer:value,submittedAt:D.serverTimestamp()});toast('已成功提交！')}}catch(e){toast('作答失敗：'+e.message)}}
function simulateAnswers(){if(S.mode!=='demo')return;let q=roundQuestion(),g=S.room.game;if(!q?.options)return;for(let uid of g.roster){if(!S.submissions[uid])S.submissions[uid]={answer:String(Math.floor(Math.random()*q.options.length)),submittedAt:now()}}render();toast('已模擬其他範例玩家的答案（僅本機體驗）')}
async function getAnswers(){if(S.mode==='demo')return structuredClone(S.submissions);let {D,db}=S.modules;let snap=await D.get(D.ref(db,`rooms/${S.code}/submissions/${S.room.game.roundId}`));return snap.val()||{}}
async function settle(judge){if(!isHost())return;let g=S.room.game;if(g.stage!=='judging')return;try{let answers=await getAnswers();let {result,scores}=settleResult(g,answers,judge);let done=await writeGame(old=>old.stage==='judging'&&old.roundId===g.roundId?{...old,stage:'revealing',result,scores,history:[...(old.history||[]),{...result,kind:roundQuestion().kind,roundId:g.roundId}]}:undefined);if(done){confetti();toast('本回合已結算！')}}catch(e){toast('無法結算：'+e.message)}}
async function finish(){if(!confirm('確定提前結束這場遊戲？'))return;let ok=await writeGame(g=>['revealing','ready','grouping'].includes(g.stage)?{...g,stage:'finished'}:undefined);if(ok)confetti()}
async function replay(){let ok=await writeGame(g=>g.stage==='finished'?{...newGame(g.mode,g.duration),stage:'lobby'}:undefined);if(ok)toast('新的一場已重設！確認準備後即可重新開始。')}
async function closeRoom(){if(!confirm('確定關閉房間？所有人將離開遊戲。'))return;let done=await writeGame(g=>({...g,stage:'closed'}));if(done){leaveRoom(false);toast('房間已關閉')}}
function leaveRoom(confirmFirst=true){if(confirmFirst&&!confirm('確定離開房間？'))return;if(S.mode==='online'&&S.modules&&S.code&&S.uid){const {D,db}=S.modules;D.set(D.ref(db,`rooms/${S.code}/players/${S.uid}/online`),false).catch(()=>{})}clearListeners();currentRoundListen='';S.room=null;S.code='';S.view='home';S.submissions={};S.mode='demo';try{localStorage.removeItem(LAST_ROOM_KEY)}catch{}render()}
async function toggleReady(){let p=myPlayer();if(!p)return;if(S.mode==='demo'){p.ready=!p.ready;render();return}let {D,db}=S.modules;try{await D.set(D.ref(db,`rooms/${S.code}/players/${S.uid}/ready`),!p.ready)}catch(e){toast(e.message)}}
function addDemo(name){if(S.mode!=='demo')return;name=name.trim().slice(0,12);if(!name)return toast('請先輸入暱稱');if(Object.values(S.room.players).some(p=>p.name===name))return toast('暱稱已存在');if(Object.keys(S.room.players).length>=20)return toast('最多 20 人');let uid='sample_'+ident();S.room.players[uid]={uid,name,ready:true,online:true,playing:true,joinedAt:Date.now()};render()}
async function saveConfig(){let text=$('#configText')?.value.trim();try{let obj=JSON.parse(text);if(!obj.apiKey||!obj.authDomain||!obj.databaseURL||!obj.projectId||!obj.appId)throw Error('缺少 apiKey、authDomain、databaseURL、projectId 或 appId');Object.assign(CONFIG,obj);localStorage.setItem(LOCAL_CONFIG_KEY,JSON.stringify(CONFIG));toast('已儲存到這台瀏覽器！公開部署前也請填入 HTML 設定區塊。');renderSetup()}catch(e){toast('設定無效：'+e.message)}}
function confetti(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;let el=$('#confetti'),colors=['#ff6ba3','#ffd566','#6e51ec','#40d8bd','#80bcff'];el.innerHTML='';for(let i=0;i<65;i++){let b=document.createElement('span');b.className='piece';b.style.left=(Math.random()*100)+'%';b.style.background=choose(colors);b.style.animationDelay=(Math.random()*.8)+'s';b.style.transform=`rotate(${Math.random()*360}deg)`;el.append(b)}setTimeout(()=>el.innerHTML='',3500)}
function switchView(v){S.room=null;S.view=v;render()}
async function handleAction(e){let button=e.target.closest('[data-action]');if(!button||button.disabled)return;let act=button.dataset.action;try{switch(act){case'home':switchView('home');break;case'help':if(S.room){toast('遊戲進行中，可從首頁查看玩法說明');break}switchView('help');break;case'setup':if(S.room){toast('請先離開房間再進行設定');break}switchView('setup');break;case'create':switchView('create');break;case'join':switchView('join');break;case'demo':S.selection.mode='party';demoCreate();break;case'demoPK':S.selection.mode='pk';demoCreate();break;case'copyRules':copyText($('#firebase-rules').textContent.trim());break;case'saveConfig':saveConfig();break;case'copyCode':copyText(S.code);break;case'copyInvite':copyText(encodedInvite());break;case'toggleReady':toggleReady();break;case'begin':hostBegin();break;case'regroup':regroup();break;case'prepare':nextQuestion();break;case'startRound':startRound();break;case'pauseRound':pauseRound();break;case'resumeRound':resumeRound();break;case'reroll':reroll();break;case'endRound':endRound();break;case'submitAnswer':submitAnswer(Number(button.dataset.index));break;case'simulate':simulateAnswers();break;case'settle':settle();break;case'judgeChallenge':settle({challenge:button.dataset.result});break;case'judgeTeam':settle({red:$('#judgeRed')?.checked,blue:$('#judgeBlue')?.checked});break;case'nextRound':if(S.room.game.round>=S.room.game.totalRounds)writeGame(g=>({...g,stage:'finished'})).then(confetti);else nextQuestion();break;case'finish':finish();break;case'replay':replay();break;case'close':closeRoom();break;case'leave':leaveRoom();break;case'resume':{let saved=getSaved();if(saved?.mode==='online'){S.joinCode=saved.code;switchView('join');toast('請輸入暱稱，將自動嘗試恢復原 UID')}break}}}catch(err){console.error(err);toast(err.message||'操作失敗')}}
app.addEventListener('click',e=>{let c=e.target.closest('[data-choice]');if(c){let [k,v]=c.dataset.choice.split(':');S.selection[k]=v;document.querySelectorAll(`[data-choice^="${k}:"]`).forEach(x=>x.classList.toggle('active',x===c));return}handleAction(e)});
document.body.addEventListener('click',e=>{if(e.target.closest('header [data-action]'))handleAction(e)});
$('#brand').addEventListener('click',()=>{if(S.room){toast('請先結束或離開房間');return}switchView('home')});
$('#brand').addEventListener('keydown',e=>{if(e.key==='Enter')$('#brand').click()});
app.addEventListener('submit',async e=>{e.preventDefault();const f=e.target;if(f.id==='createForm'){S.nick=f.elements.nick.value.trim().slice(0,12);S.selection.duration=Number(f.elements.duration.value);S.selection.difficulty=f.elements.difficulty.value;S.selection.playing=f.elements.playing.checked;if(!S.nick)return toast('請輸入暱稱');await createOnline()}else if(f.id==='joinForm'){S.nick=f.elements.nick.value.trim().slice(0,12);let code=f.elements.code.value.trim().toUpperCase();if(!S.nick||!/^[A-Z2-9]{6}$/.test(code))return toast('請輸入暱稱及有效的六碼房號');await joinOnline(code,S.nick)}else if(f.id==='addDemoForm'){addDemo(f.elements.newname.value)}});
setInterval(updateClock,240);
const urlRoom=new URLSearchParams(location.search).get('room');if(urlRoom&&/^[A-Z2-9]{6}$/i.test(urlRoom)){S.joinCode=urlRoom.toUpperCase();S.view='join'}
render();
</script>
</body>
